<!DOCTYPE html>
<html>
    <head>
        <title>Oundle and District Choral Society</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <link rel="stylesheet" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <nav class="navbar navbar-default navbar-fixed-top">
            <div class="container">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar">
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="#">Logo</a>
                </div>
                <div class="collapse navbar-collapse" id="navbar">
                    <ul class="nav navbar-nav navbar-right">
                        <li><a href="#about">About Us</a></li>
                        <li><a href="#services">Concerts & Events</a></li>
                        <li><a href="#portfolio">Members</a></li>
                        <li><a href="#pricing">Music</a></li>
                        <li><a href="#contact">Contact Us</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div id="carousel" class="carousel" data-ride="carousel">
            <!-- Indicators -->
            <ol class="carousel-indicators">
                <li data-target="#carousel" data-slide-to="0" class="active"></li>
                <li data-target="#carousel" data-slide-to="1"></li>
                <li data-target="#carousel" data-slide-to="2"></li>
                <li data-target="#carousel" data-slide-to="3"></li>
                <li data-target="#carousel" data-slide-to="4"></li>
                <li data-target="#carousel" data-slide-to="5"></li>
                <li data-target="#carousel" data-slide-to="6"></li>
                <li data-target="#carousel" data-slide-to="7"></li>
            </ol>

            <!-- Wrapper for slides -->
            <div class="carousel-inner" role="listbox">
                <div class="item active">
                    <img src="Images/carousel0.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel1.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel2.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel3.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel4.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel5.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel6.png" width="100%">
                </div>
                <div class="item">
                    <img src="Images/carousel7.png" width="100%">
                </div>
            </div>
        </div>
